version: '3.8'

services:
  # Backend API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: webconnex-text-sql-backend
    environment:
      - AWS_REGION=${AWS_REGION:-us-west-2}
      - REDSHIFT_CLUSTER_ID=${REDSHIFT_CLUSTER_ID:-wbx-data}
      - REDSHIFT_DATABASE=${REDSHIFT_DATABASE:-wbx_data}
      - BEDROCK_MODEL_ID=${BEDROCK_MODEL_ID:-anthropic.claude-3-sonnet-20240229-v1:0}
      - S3_BUCKET_VECTORS=${S3_BUCKET_VECTORS:-webconnex-text-to-sql-vectors}
      - REDIS_HOST=redis
      - RUN_LOCALLY=${RUN_LOCALLY:-1}
      - API_HOST=0.0.0.0
      - API_PORT=8000
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ~/.aws:/root/.aws:ro  # AWS credentials (read-only)
    depends_on:
      - redis
    networks:
      - webconnex-network
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload

  # Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: webconnex-text-sql-frontend
    environment:
      - REACT_APP_API_URL=http://localhost:8000
      - REACT_APP_OKTA_DOMAIN=${OKTA_DOMAIN}
      - REACT_APP_OKTA_CLIENT_ID=${OKTA_CLIENT_ID}
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules  # Prevent node_modules from being overwritten
    depends_on:
      - backend
    networks:
      - webconnex-network
    command: npm start

  # Redis Cache Service
  redis:
    image: redis:7-alpine
    container_name: webconnex-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - webconnex-network
    command: redis-server --appendonly yes

  # PostgreSQL for local development (optional)
  postgres:
    image: postgres:15-alpine
    container_name: webconnex-postgres
    environment:
      - POSTGRES_DB=webconnex_dev
      - POSTGRES_USER=webconnex
      - POSTGRES_PASSWORD=dev_password_change_me
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./data/schemas:/docker-entrypoint-initdb.d:ro
    networks:
      - webconnex-network
    profiles:
      - dev  # Only start with --profile dev

  # Prometheus for metrics
  prometheus:
    image: prom/prometheus:latest
    container_name: webconnex-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus:/etc/prometheus
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - webconnex-network
    profiles:
      - monitoring  # Only start with --profile monitoring

  # Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: webconnex-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana:/etc/grafana/provisioning
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - webconnex-network
    profiles:
      - monitoring  # Only start with --profile monitoring

  # Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: webconnex-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend
    networks:
      - webconnex-network
    profiles:
      - production  # Only start with --profile production

networks:
  webconnex-network:
    driver: bridge

volumes:
  redis-data:
  postgres-data:
  prometheus-data:
  grafana-data: